name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Security audit gate — fail the build on any moderate, high, or critical vuln.
      # Tightened from --audit-level=high to --audit-level=moderate after PR #19
      # cleared the last 2 moderates (markdown-it ReDoS via react-native-markdown-display).
      # Low-severity advisories remain tracked in the PR-body audit table, not blocked.
      # See SECURITY.md and .sdd/active-specs/cicd.md for the policy.
      - name: Security audit (moderate+)
        run: npm audit --audit-level=moderate

      # Generate Prisma client (required by API tests)
      - run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      # Build shared package first (other packages depend on it)
      - run: npm run shared:build

      # Run all tests (shared + API)
      - run: npm test

  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate --schema=apps/api/prisma/schema.prisma
      - run: npm run shared:build
      - run: npm run lint
      - run: npm run typecheck

      - name: Forbid silent catch blocks
        run: |
          # REQ-CS-2: empty catch blocks (incl. /* ignore */) are forbidden.
          # Match: catch(){...empty}, catch{...empty}, with optional only-comment body.
          if grep -rEn 'catch\s*(\([^)]*\))?\s*\{\s*(/\*[^*]*\*/\s*)?\}' apps/mobile/src apps/api/src --include='*.ts' --include='*.tsx'; then
            echo "ERROR: Silent catch block found — add Sentry.captureException(err) or proper handling."
            exit 1
          fi

  api-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate --schema=apps/api/prisma/schema.prisma
      - run: npm run shared:build
      - run: npm run api:build

  # ─── apps/web lanes (Phase 1 of web-bootstrap) ──────────────────────────
  # All three run in parallel with the lanes above. Each one independently
  # installs deps + generates Prisma client + builds shared, because GitHub
  # Actions jobs do not share a filesystem by default.

  web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate --schema=apps/api/prisma/schema.prisma
      - run: npm run shared:build
      - run: npm run test -w @matchday/web

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate --schema=apps/api/prisma/schema.prisma
      - run: npm run shared:build
      - run: npm run build -w @matchday/web

  web-lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate --schema=apps/api/prisma/schema.prisma
      - run: npm run shared:build
      - run: npm run lint -w @matchday/web
      - run: tsc --noEmit -p apps/web/tsconfig.json
