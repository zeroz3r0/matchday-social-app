name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Generate Prisma client (required by API tests)
      - run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      # Build shared package first (other packages depend on it)
      - run: npm run shared:build

      # Run all tests (shared + API)
      - run: npm test

  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate --schema=apps/api/prisma/schema.prisma
      - run: npm run shared:build
      - run: npm run lint
      - run: npm run typecheck

      - name: Forbid silent catch blocks
        run: |
          # REQ-CS-2: empty catch blocks (incl. /* ignore */) are forbidden.
          # Match: catch(){...empty}, catch{...empty}, with optional only-comment body.
          if grep -rEn 'catch\s*(\([^)]*\))?\s*\{\s*(/\*[^*]*\*/\s*)?\}' apps/mobile/src apps/api/src --include='*.ts' --include='*.tsx'; then
            echo "ERROR: Silent catch block found — add Sentry.captureException(err) or proper handling."
            exit 1
          fi

  api-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate --schema=apps/api/prisma/schema.prisma
      - run: npm run shared:build
      - run: npm run api:build
